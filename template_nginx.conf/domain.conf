
server {
    # Only listen localhost.
    listen 127.0.0.1:80;

    server_name <sub_domain>.dngcorp.asia;

    # Hide nginx version
    server_tokens off;

    # Maximum upload size
    client_max_body_size 50m;

    # HTTP header reception timeout
    client_header_timeout 15s;

    # Request body reception timeout
    client_body_timeout 60s;

    # Time limit for sending a response to client
    send_timeout 60s;

    # Disable directory listing
    autoindex off;

    # Average of 10 request/s/IP
    # Allows a maximum burst of 30 request
    limit_req zone=global_req_limit burst=30 nodelay;

    # Return HTTP 429 when the rate limit is exceeded
    limit_req_status 429;

    # Maximum of 30 concurrent connections per IP
    limit_conn global_conn_limit 30;

    # Return HTTP 429 when the connection limit is exceeded
    limit_conn_status 429;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Control Referer information
    add_header Referrer-Policy
        "strict-origin-when-cross-origin" always;

    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/<sub_domain>_access.log customize;

    error_log /var/log/nginx/<sub_domain>_error.log warn;

    # Block access to hidden files or folders
    # Ex: .env, .git, .htaccess
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {

        # Allow only standard HTTP methods
        limit_except GET HEAD POST PUT PATCH DELETE OPTIONS {
            deny all;
        }

        # Backend ERP
        proxy_pass http://<ip>:<port>;

        # HTTP version
        proxy_http_version 1.1;


        # Preserve the hostname accessed by the user
        proxy_set_header Host $host;

        # Client's real IP from Cloudflare
        proxy_set_header X-Real-IP $client_real_ip;

        # Pass the client IP to the backend
        proxy_set_header X-Forwarded-For $client_real_ip;

        # Users access the website via HTTPS at Cloudflare
        proxy_set_header X-Forwarded-Proto https;

        # Original hostname
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection $connection_upgrade;

        # Connection setup time
        proxy_connect_timeout 10s;

        # Request submission time
        proxy_send_timeout 120s;

        # Data retrieval latency
        proxy_read_timeout 120s;

        # Enable response buffering
        proxy_buffering on;

        # Buffer for reading response headers
        proxy_buffer_size 16k;

        # Buffer for reading response body
        proxy_buffers 8 16k;

        # Buffer the complete request body before forwarding to backend
        proxy_request_buffering on;

        # Does not automatically switch to another upstream
        proxy_next_upstream off;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx is healthy\n";
    }

}
