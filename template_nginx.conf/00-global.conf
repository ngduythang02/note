
# ==========================================
# 00-global.conf
# Global Nginx configuration
# Cloudflare Tunnel + Reverse Proxy
# ==========================================

# ------------------------------------------
# 1. Trust Cloudflare Tunnel on localhost
# ------------------------------------------

set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

# ------------------------------------------
# 2. Client IP and rate-limit variables
# ------------------------------------------

map $remote_addr $client_real_ip {
    default $remote_addr;
}

map $remote_addr $client_limit_key {
    default $binary_remote_addr;
}

# ------------------------------------------
# 3. WebSocket support
# ------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ------------------------------------------
# 4. Global request rate limiting
# ------------------------------------------

limit_req_zone $client_limit_key
    zone=global_req_limit:10m
    rate=10r/s;

# ------------------------------------------
# 5. Global connection limiting
# ------------------------------------------

limit_conn_zone $client_limit_key
    zone=global_conn_limit:10m;

# ------------------------------------------
# 6. Global access log format
# ------------------------------------------

log_format customize
    '$client_real_ip - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" '
    '$status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'CF-Ray="$http_cf_ray" '
    'RequestTime="$request_time" '
    'UpstreamTime="$upstream_response_time"';
